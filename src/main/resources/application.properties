spring.application.name=backend
jwt.secret=${JWT_SECRET:TeacherAI-Secure-Secret-Key-For-JWT-256Bits!!}
server.port=${PORT:8080}

# ── Database (local H2 fallback) ──
spring.datasource.url=jdbc:h2:mem:teacherai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# Mail (Resend HTTP API — bypasses Railway SMTP port blocks entirely)
resend.api.key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:onboarding@smartboard.co.in}

# Admin setup (one-time secret to promote a user to ADMIN)
admin.setup.secret=${ADMIN_SETUP_SECRET:}

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID:}

# Railway Bucket (S3-compatible) — set these only on the backend service
# Supports both the custom names documented for SmartBoard and Railway Bucket's
# standard auto-injected S3 variables.
storage.bucket-name=${STORAGE_BUCKET_NAME:${AWS_S3_BUCKET_NAME:${BUCKET:}}}
storage.endpoint=${STORAGE_ENDPOINT:${AWS_ENDPOINT_URL:}}
storage.region=${STORAGE_REGION:${AWS_DEFAULT_REGION:auto}}
storage.access-key=${STORAGE_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
storage.secret-key=${STORAGE_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}
demo.video-key=${DEMO_VIDEO_KEY:}

# Lesson video uploads (the admin UI enforces the same 2 GB limit)
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
